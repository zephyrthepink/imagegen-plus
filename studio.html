<div class="ig-root ig-studio">
    <header class="ig-studio-header"><h3>Image studio</h3></header>
    <div class="ig-studio-layout">
        <div class="ig-compose-column">
            <section class="ig-studio-card">
                <div class="ig-card-heading"><h4>Prompt</h4><button class="menu_button" type="button" data-action="write"><i class="fa-solid fa-brain" aria-hidden="true"></i> Write with AI</button></div>
                <label class="ig-field ig-draft-field"><span class="ig-sr-only">Image prompt</span><textarea class="text_pole" rows="7" data-draft placeholder="Describe your image…"></textarea></label>
                <details class="ig-direction"><summary>Scene direction</summary><label class="ig-field"><span class="ig-sr-only">Scene direction</span><textarea class="text_pole" rows="2" data-focus placeholder="Optional direction for the prompt writer…"></textarea></label></details>
                <details class="ig-final-preview"><summary>Final prompt</summary><p data-final-prompt></p></details>
            </section>
            <section class="ig-studio-card ig-generation-options">
                <div class="ig-card-heading"><h4>Generation</h4><small>For this image</small></div>
                <label class="ig-field"><span>Model</span><select class="text_pole" data-image-option="model"></select></label>
                <div class="ig-option-grid">
                    <label class="ig-field"><span>Image size</span><select class="text_pole" data-studio-size><option value="1024x1024">Square · 1024 × 1024</option><option value="768x1024">Portrait · 768 × 1024</option><option value="1024x768">Landscape · 1024 × 768</option><option value="512x512">Small · 512 × 512</option><option value="">Custom</option></select></label>
                    <label class="ig-field"><span>Seed</span><input class="text_pole" type="number" min="0" max="4294967295" step="1" data-image-option="seed" placeholder="Random"></label>
                </div>
                <div class="ig-option-grid" data-custom-size hidden>
                    <label class="ig-field"><span>Width</span><input class="text_pole" type="number" min="256" max="2048" step="1" data-image-option="width"></label>
                    <label class="ig-field"><span>Height</span><input class="text_pole" type="number" min="256" max="2048" step="1" data-image-option="height"></label>
                </div>
            </section>
        </div>
        <section class="ig-studio-card ig-preview-card">
            <div class="ig-card-heading"><h4>Images</h4><small data-image-count></small></div>
            <div class="ig-empty-preview" data-empty-preview><i class="fa-regular fa-image" aria-hidden="true"></i><span>Your image will appear here</span></div>
            <div class="ig-result" hidden>
                <a class="ig-image-frame" data-image-link target="_blank" rel="noopener noreferrer"><img data-image alt="Latest generated scene"></a>
                <div class="ig-gallery" data-image-gallery hidden></div>
                <p class="ig-hint" data-result-meta></p>
                <div class="ig-result-actions"><a class="menu_button" data-download download="uige.jpg"><i class="fa-solid fa-download" aria-hidden="true"></i> Download</a><button class="menu_button" type="button" data-action="reuse">Reuse prompt</button><button class="menu_button" type="button" data-action="repeat">Repeat image</button></div>
            </div>
        </section>
    </div>
    <footer class="ig-studio-footer">
        <p class="ig-status" role="status" aria-live="polite">Ready</p>
        <div class="ig-toolbar"><button class="menu_button" type="button" data-action="scene">Illustrate scene</button><button class="menu_button ig-primary" type="button" data-action="generate"><i class="fa-solid fa-image" aria-hidden="true"></i> Generate image</button><button class="menu_button ig-cancel" type="button" data-action="cancel" hidden>Cancel</button></div>
    </footer>
</div>
